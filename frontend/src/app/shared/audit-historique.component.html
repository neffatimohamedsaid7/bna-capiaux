<div class="card">
  <div class="card-title">Historique</div>
  <p class="muted" *ngIf="chargement">Chargement...</p>
  <div class="table-wrap" *ngIf="!chargement">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Opérateur</th>
          <th>Action</th>
          <th>Détails</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let e of entrees">
          <td>{{ e.dateAction | date: 'dd/MM/yyyy HH:mm:ss' }}</td>
          <td>{{ e.operateur }}</td>
          <td>{{ typeActionLabels[e.typeAction] }}</td>
          <td>{{ e.details || '-' }}</td>
        </tr>
        <tr *ngIf="!entrees.length">
          <td colspan="4" class="empty-state">Aucune action enregistrée.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
