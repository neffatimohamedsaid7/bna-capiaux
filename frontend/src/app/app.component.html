<header class="app-header" *ngIf="!isLoginPage()">
  <div class="app-header-inner">
    <a routerLink="/" class="brand">
      <span class="brand-icon"><app-icon name="bank" [size]="20" [strokeWidth]="1.8"></app-icon></span>
      <span class="brand-mark">BNA</span>
      <span class="brand-name">Capitaux</span>
    </a>
    <nav class="app-nav">
      <a
        *ngFor="let link of navLinks"
        [routerLink]="link.path"
        routerLinkActive="active"
        class="app-nav-link"
      ><app-icon [name]="link.icon" [size]="16" [strokeWidth]="1.9"></app-icon>{{ link.label }}</a>
      <a
        *ngIf="authService.isAdmin()"
        routerLink="/admin/utilisateurs"
        routerLinkActive="active"
        class="app-nav-link"
      ><app-icon name="utilisateurs" [size]="16" [strokeWidth]="1.9"></app-icon>Utilisateurs</a>
    </nav>
    <div class="app-user" *ngIf="authService.currentUser() as user">
      <span class="app-user-avatar">{{ initials(user.prenom, user.nom) }}</span>
      <span class="app-user-text">
        <span class="app-user-name">{{ user.prenom }} {{ user.nom }}</span>
        <span class="app-user-role">{{ roleLabels[user.role] }}</span>
      </span>
      <button type="button" class="app-logout-btn" (click)="logout()" title="Déconnexion">
        <app-icon name="logout" [size]="16" [strokeWidth]="1.9"></app-icon>
      </button>
    </div>
  </div>
</header>

<main [class.page]="!isLoginPage()">
  <router-outlet></router-outlet>
</main>

<app-chat-widget *ngIf="!isLoginPage()"></app-chat-widget>
