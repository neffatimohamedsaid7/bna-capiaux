services:
  postgres:
    image: postgres:16-alpine
    container_name: bnac_postgres
    environment:
      POSTGRES_DB: bnac_db
      POSTGRES_USER: bnac_user
      POSTGRES_PASSWORD: change_me
    ports:
      - "5433:5432"
    volumes:
      - bnac_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bnac_user -d bnac_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bnac_postgres_data:
